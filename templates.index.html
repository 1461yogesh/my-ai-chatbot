<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="avatar"><i class="fa-solid fa-robot"></i></div>
      <div>
        <h2>HuggingFace Assistant</h2>
        <span class="status-indicator">Online</span>
      </div>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="message assistant-message">Hello! How can I help you today?</div>
    </div>

    <form class="input-container" id="chatForm">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
