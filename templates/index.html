<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="bot-badge">AI</div>
      <div>
        <h3>AI Assistant</h3>
        <p class="status">Online • Ready</p>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg assistant">Hi! Ask me anything.</div>
    </div>

    <form class="input-bar" id="chatForm">
      <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
